name: Android APK

on:
  push:
    branches: [main, touch-menu]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          chmod +x scripts/build_android_debug.sh android/gradlew
          ./scripts/build_android_debug.sh

      - name: Verify no game data in APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if unzip -l "$APK" | grep -i '\.mix'; then
            echo "Game data (.MIX) found in APK"
            exit 1
          fi

      - name: Name APK
        run: |
          NAME="Vanillara-${GITHUB_REF_NAME//\//-}.apk"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$NAME"
          echo "APK_PATH=dist/$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: vanillara-apk
          path: ${{ env.APK_PATH }}

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
